{% extends 'base.html' %}
{% load static %}
{% block title %}Submit Approval Request - Barter.com{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="admin-card">
                <div class="card-header">
                    <i class="fas fa-paper-plane me-2"></i> Submit Approval Request
                </div>
                <div class="card-body p-4">
                    <form method="POST">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label for="request_type" class="form-label fw-semibold">Request Type</label>
                            <select name="request_type" id="request_type" class="form-select" required>
                                <option value="">Select request type...</option>
                                {% for value, label in request_types %}
                                <option value="{{ value }}">{{ label }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="subject" class="form-label fw-semibold">Subject</label>
                            <input type="text" name="subject" id="subject" class="form-control" placeholder="Brief description of your request" required>
                        </div>

                        <div class="mb-3">
                            <label for="description" class="form-label fw-semibold">Description</label>
                            <textarea name="description" id="description" class="form-control" rows="5" placeholder="Provide details about your request..." required></textarea>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary rounded-pill px-4">
                                <i class="fas fa-paper-plane"></i> Submit Request
                            </button>
                            <a href="{% url 'properties:my_approval_requests' %}" class="btn btn-outline-secondary rounded-pill px-4">
                                Cancel
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
